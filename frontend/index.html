<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okghumo Assistant</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand-text:#fff;--bot:#fff;--err:#b42318;--errbg:#fef3f2;--ok:#067647}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e8eaee;--muted:#9aa3b2;--line:#262b36;--bot:#1d212b;--err:#fda29b;--errbg:#2a1614;--ok:#75e0a7}}
  *{box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;flex:1}
  .pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--errbg);color:var(--err)}
  .pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px}
  button.primary{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:default}
  #settings{display:none;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  #settings.open{display:block}
  #settings label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  #settings .row{display:flex;gap:8px}
  #settings input{flex:1;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
  #settings p{margin:6px 0 0;font-size:12px;color:var(--muted)}
  #msg{min-height:18px}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:860px;width:100%;margin:0 auto}
  .m{max-width:78%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:var(--brand);color:var(--brand-text);border-bottom-right-radius:4px}
  .assistant{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .assistant.error{background:var(--errbg);color:var(--err);border-color:transparent}
  .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tools span{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .empty{margin:auto;text-align:center;color:var(--muted)}
  .empty h2{color:var(--text);margin:0 0 6px;font-size:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  form{display:flex;gap:8px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
  form .in{display:flex;gap:8px;max-width:860px;width:100%;margin:0 auto}
  textarea{flex:1;resize:none;padding:10px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);max-height:140px}
</style>
</head>
<body>
<header>
  <h1>Okghumo Assistant</h1>
  <span id="status" class="pill">Not signed in</span>
  <button id="newchat" type="button">New chat</button>
  <button id="gear" type="button">Settings</button>
</header>

<section id="settings">
  <label for="jwt">Access token (JWT) — saved in this browser, so you only paste it again when it expires</label>
  <div class="row"><input id="jwt" type="password" placeholder="paste JWT" autocomplete="off"><button id="clearjwt" type="button">Forget</button></div>
  <label for="okg">OkGhumo login token — needed once per vendor; sent to the server, never saved in this browser</label>
  <div class="row"><input id="okg" type="password" placeholder="paste OkGhumo login token" autocomplete="off"><button id="connect" class="primary" type="button">Connect</button></div>
  <p id="msg"></p>
</section>

<div id="log"></div>

<form id="f"><div class="in">
  <textarea id="q" rows="1" placeholder="Ask about your bookings, sales, collections…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
  <button id="send" class="primary">Send</button>
</div></form>
<script type="module" src="/main.js"></script>
</body>
</html>
